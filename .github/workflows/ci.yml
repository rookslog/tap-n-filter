name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  matrix-build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # One runner failing should not mask the result on the others — a
      # version-specific layout or SDK problem is exactly what this matrix
      # exists to surface.
      fail-fast: false
      matrix:
        # Labels are pinned explicitly. `macos-latest` silently re-points when
        # GitHub rotates the fleet, which would turn a deliberate version
        # matrix into an accidental one (ADR-022 item 5).
        #
        # macos-14 is the supported floor (ADR-005). There is no macos-27
        # image and there will not be one for months, so the newest-OS check
        # remains the manual pre-merge gate in docs/governance/review-tiers.md.
        os: [macos-14, macos-15, macos-26]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Swift Package Manager)
        run: swift build -c debug

      - name: Test
        run: swift test -c debug --enable-code-coverage

      # Fake-backed offscreen dump: refresh evidence after the header/menu change.
      # This is not the newest-macOS actual-menu/VoiceOver merge gate.
      - name: Generate diagnostics accessibility evidence
        if: matrix.os == 'macos-26'
        run: |
          swift run -c debug --skip-build tap-n-filter-a11y-dump
          test -s test-artifacts/phase-3-accessibility-tree.json
          test -s test-artifacts/phase-3-accessibility-diagnostics.json

      - name: Upload diagnostics accessibility evidence
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-accessibility-${{ github.sha }}
          path: |
            test-artifacts/phase-3-accessibility-tree.json
            test-artifacts/phase-3-accessibility-diagnostics.json
          if-no-files-found: error
          retention-days: 7

  # Aggregating gate. `main`'s branch protection requires a status check named
  # exactly "Build and test"; a matrix job cannot produce that name, because
  # GitHub suffixes every leg with its matrix values. Without this job the
  # required context would never report again and every PR would become
  # permanently unmergeable. This job carries the required name and passes
  # only when every matrix leg succeeded.
  #
  # If the matrix gains or loses an OS, nothing here changes — `needs` covers
  # the whole job regardless of how many legs it expands to.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: matrix-build
    # `always()` so a failed or cancelled leg still produces a reported
    # conclusion here rather than leaving the required check pending forever.
    if: always()

    steps:
      - name: Verify every matrix leg passed
        run: |
          result="${{ needs.matrix-build.result }}"
          echo "matrix-build result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more OS legs did not succeed ($result)."
            exit 1
          fi

  # Integration tests are gated behind a workflow_dispatch trigger because
  # they require real Core Audio devices and are slow on the CI runner.
  integration-tests:
    name: Integration tests (manual)
    runs-on: macos-14
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: swift test -c debug --filter CaptureIntegrationTests
