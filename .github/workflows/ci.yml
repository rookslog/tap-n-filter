name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  matrix-build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # One runner failing should not mask the result on the others — a
      # version-specific layout or SDK problem is exactly what this matrix
      # exists to surface.
      fail-fast: false
      matrix:
        # Labels are pinned explicitly. `macos-latest` silently re-points when
        # GitHub rotates the fleet, which would turn a deliberate version
        # matrix into an accidental one (ADR-022 item 5).
        #
        # macos-14 retired on 2026-11-02. macOS 14.4 remains the deployment
        # floor (ADR-005), not runtime coverage provided by this CI matrix.
        # Results on newer runners do not establish macOS 14.4 acceptance.
        os: [macos-15, macos-26]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Swift Package Manager)
        run: swift build -c debug

      - name: Test
        run: swift test -c debug --enable-code-coverage

  # Aggregating gate. `main`'s branch protection requires a status check named
  # exactly "Build and test"; a matrix job cannot produce that name, because
  # GitHub suffixes every leg with its matrix values. Without this job the
  # required context would never report again and every PR would become
  # permanently unmergeable. This job carries the required name and passes
  # only when every matrix leg succeeded.
  #
  # If the matrix gains or loses an OS, nothing here changes — `needs` covers
  # the whole job regardless of how many legs it expands to.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: matrix-build
    # `always()` so a failed or cancelled leg still produces a reported
    # conclusion here rather than leaving the required check pending forever.
    if: always()

    steps:
      - name: Verify every matrix leg passed
        run: |
          result="${{ needs.matrix-build.result }}"
          echo "matrix-build result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more OS legs did not succeed ($result)."
            exit 1
          fi

  # Real Core Audio qualification still requires a prepared native environment.
  integration-tests:
    name: Integration tests (manual)
    runs-on: macos-15
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: swift test -c debug --filter CaptureIntegrationTests

  # Diagnostic, this branch only: the long menu enumerations (Tests/RebuildEnumerations), sharded so each
  # job fits its timeout. A shard passes only when every spec in it prints a clean ENUM-SUMMARY line with
  # the pinned enumeration size; a missing line (crash, hang, skip or timeout) fails it.
  enumerations:
    name: Enumerations ${{ matrix.shard.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    if: github.head_ref == 'diag/menu-enumerations'

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        shard:
          - { name: "rerun 971", specs: "S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 2 971 1;S5 5 0 971 1;S5 5 0 971 1;S5 5 0 971 1;S5 5 0 971 1;S5 5 0 971 1;S5 5 1 971 1;S5 5 1 971 1;S5 5 1 971 1;S5 5 1 971 1;S5 5 1 971 1" }

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build tests
        run: swift build -c debug --build-tests

      - name: Run shard
        shell: bash
        env:
          TNF_ENUM: ${{ matrix.shard.specs }}
        run: |
          set -o pipefail
          status=0
          swift test -c debug --skip-build --filter RebuildEnumerationTests 2>&1 | tee enumerations.log || status=$?
          grep -E 'ENUM-(SUMMARY|RED|NOTE)' enumerations.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          IFS=';' read -ra specs <<< "$TNF_ENUM"
          for spec in "${specs[@]}"; do
            read -r suite level hold from count <<< "$spec"
            case "$suite $level" in
              "S1 5") total=1997 ;;
              "S2 4") total=1685 ;;
              "S3 4") total=10170 ;;
              "S4 5") total=6763 ;;
              "S5 5") total=2218 ;;
              *) echo "::error::no pinned total for $suite $level"; status=1; continue ;;
            esac
            want="ENUM-SUMMARY suite=$suite level=$level hold=$hold from=$from count=$count total=$total green=$count red=0 unsupported=0 result=clean "
            if ! grep -qF "$want" enumerations.log; then
              echo "::error::missing or not clean: $want"; status=1
            fi
          done
          exit $status
